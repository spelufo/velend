schema_version = "1.0.0"

id = "velend"
version = "0.3.0"
name = "velend"
tagline = "Explore the X-ray scans from the Vesuvius Challenge"
maintainer = "Santiago Pelufo"
type = "add-on"

website = "https://scrollprize.org/"

# # Optional: tag list defined by Blender and server, see:
# # https://docs.blender.org/manual/en/latest/advanced/extensions/tags.html
# tags = ["Animation", "Sequencer"]

blender_version_min = "5.1.0"

# License conforming to https://spdx.org/licenses/ (use "SPDX: prefix)
# https://docs.blender.org/manual/en/latest/advanced/extensions/licenses.html
license = [
  "SPDX:MIT",
]
copyright = [
  "2023-2026 Santiago Pelufo",
]

# Supported platforms, and the 3rd party Python modules from requirements.txt
# bundled for them. Both lists are regenerated from the contents of wheels/ by
# scripts/build.py, and by scripts/develop.py for this machine alone, so change
# those scripts rather than these lists.
# https://docs.blender.org/manual/en/latest/advanced/extensions/python_wheels.html
# BEGIN generated by scripts/build.py
platforms = [
  "macos-arm64",
  "macos-x64",
  "linux-x64",
  "windows-x64",
]
wheels = [
  "./wheels/donfig-0.8.1.post1-py3-none-any.whl",
  "./wheels/google_crc32c-1.8.0-cp313-cp313-macosx_12_0_arm64.whl",
  "./wheels/google_crc32c-1.8.0-cp313-cp313-macosx_12_0_x86_64.whl",
  "./wheels/google_crc32c-1.8.0-cp313-cp313-manylinux1_x86_64.manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_5_x86_64.whl",
  "./wheels/google_crc32c-1.8.0-cp313-cp313-win_amd64.whl",
  "./wheels/imagecodecs-2026.8.16-cp312-abi3-macosx_10_15_x86_64.whl",
  "./wheels/imagecodecs-2026.8.16-cp312-abi3-macosx_11_0_arm64.whl",
  "./wheels/imagecodecs-2026.8.16-cp312-abi3-manylinux_2_28_x86_64.whl",
  "./wheels/imagecodecs-2026.8.16-cp312-abi3-win_amd64.whl",
  "./wheels/numcodecs-0.16.5-cp313-cp313-macosx_10_13_x86_64.whl",
  "./wheels/numcodecs-0.16.5-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/numcodecs-0.16.5-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/numcodecs-0.16.5-cp313-cp313-win_amd64.whl",
  "./wheels/pyyaml-6.0.3-cp313-cp313-macosx_10_13_x86_64.whl",
  "./wheels/pyyaml-6.0.3-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/pyyaml-6.0.3-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/pyyaml-6.0.3-cp313-cp313-win_amd64.whl",
  "./wheels/tifffile-2026.9.9-py3-none-any.whl",
  "./wheels/zarr-3.3.0-py3-none-any.whl",
]
# END generated

# Optional: add-ons can list which resources they will require:
# * files (for access of any filesystem operations)
# * network (for internet access)
# * clipboard (to read and/or write the system clipboard)
# * camera (to capture photos and videos)
# * microphone (to capture audio)
#
# If using network, remember to also check `bpy.app.online_access`
# https://docs.blender.org/manual/en/latest/advanced/extensions/addons.html#internet-access
#
# For each permission it is important to also specify the reason why it is required.
# Keep this a single short sentence without a period (.) at the end.
# For longer explanations use the documentation or detail page.

[permissions]
files = "Read volumes and store downloaded objects in a local Zarr mirror"
network = "Download public volume metadata and missing Zarr mirror objects"

# Advanced build settings.
# https://docs.blender.org/manual/en/latest/advanced/command_line/extension_arguments.html#command-line-args-extension-build
[build]
# The first three are Blender's defaults. The rest is development-only material
# that a downloaded extension has no use for.
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/build/",
  "/blender/",
  "/convos/",
  "/.claude/",
  ".DS_Store",
  "/scripts/",
  "/tests/",
  "/.gitignore",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/TODO.md",
  "/requirements.txt",
]
